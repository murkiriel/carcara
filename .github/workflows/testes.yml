# Testes do gerador a cada push e pull request. Só os testes: nada de recortar o build da Protomaps nem de publicar
# aqui (isso é o workflow de geração). Nenhum teste usa a rede além do servidor local que os próprios testes sobem.
name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gerador
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install --require-hashes -r requirements.txt
      - name: Ferramenta pmtiles (versão fixada, sha256 conferido)
        run: python scripts/install_pmtiles.py --dest "$RUNNER_TEMP/pmtiles"
      - name: Testes
        run: python -m unittest discover -s tests -t . -v
